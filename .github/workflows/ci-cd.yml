name: CI/CD Pipeline
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Configuracion de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
      - name: Instalar dependencias
        run: npm install
      - name: ESLint
        run: npx eslint
      - name: Ejecutar pruebas
        run: npm test

      - name: configuracon de python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Instalar dependencias de python
        run: pip install -r requeriments.txt

      - name: Ejecutar pruebas Python
        run: pytest
      - name: Contruir proyecto
        run: |
          if [-f tsconfig.json]; then npm run build; fi

